[build]
  publish = "."

[[redirects]]
  from = "/journey"
  to = "/modules/01-journey/index.html"
  status = 200

[[redirects]]
  from = "/battle"
  to = "/modules/02-battle/index.html"
  status = 200

[[redirects]]
  from = "/wisdom"
  to = "/modules/03-wisdom/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
