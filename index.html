<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>குறள் வீரப் பயணம் — Router</title>
  <style>
    body {
      margin: 0;
      background: #080808;
      color: #F1D7A0;
      font-family: 'Catamaran', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .loading-box {
      text-align: center;
    }
    .loading-spinner {
      font-size: 3rem;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-box">
    <div class="loading-spinner">⚔️</div>
    <h2>குறள் வீரப் பயணம் ஏற்றப்படுகிறது...</h2>
  </div>

  <script>
    // Shared State Router
    const stateStr = localStorage.getItem('kuralQuest.state');
    let currentModule = 'journey';
    if (stateStr) {
      try {
        const parsed = JSON.parse(stateStr);
        if (parsed && parsed.currentModule) {
          currentModule = parsed.currentModule;
        }
      } catch (e) {}
    }

    // Redirect to active module index.html
    if (currentModule === 'battle') {
      window.location.href = 'modules/02-battle/index.html';
    } else if (currentModule === 'wisdom') {
      window.location.href = 'modules/03-wisdom/index.html';
    } else {
      window.location.href = 'modules/01-journey/index.html';
    }
  </script>
</body>
</html>
